# deploy/darabricks/jobs/ingest_yahoo.yaml
# notebook_path is written against a personal Repos checkout while iterating on a feature
# branch; promote_job_specs.py rewrites the /Workspace/Users/*/finhive-2026/ prefix to
# /Workspace/Shared/finhive-2026/ on merge to main (ARCHITECTURE_V2.md #6.2).
name: finhive_ingest_yahoo
tasks:
  - task_key: ingest_yahoo
    notebook_task:
      notebook_path: /Workspace/Users/facumazzola@gmail.com/finhive-2026/notebooks/data_ingestion/yahoo/orchestrator
      base_parameters:
        job_name: finhive_ingest_yahoo
        worker_notebook_path: /Workspace/Users/facumazzola@gmail.com/finhive-2026/notebooks/data_ingestion/yahoo/worker
    environment_key: ingestion
environments:
  - environment_key: ingestion
    spec:
      client: "3"
      dependencies:
        - yfinance
# The market closes at 16:00 America/New_York; timezone_id (not a UTC offset) is what
# keeps this correct across the DST transition.
schedule:
  quartz_cron_expression: "0 30 16 ? * MON-FRI"
  timezone_id: America/New_York
  pause_status: UNPAUSED
queue:
  enabled: true
email_notifications:
  on_failure:
    - "{alert_email}"
max_retries: 1
