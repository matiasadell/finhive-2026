name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-databricks-free
  cancel-in-progress: false

jobs:
  update-notebook-paths:
    runs-on: ubuntu-latest
    environment: free
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/scripts/requirements.txt') }}
      - run: pip install -r .github/scripts/requirements.txt
      - name: Promote job specs to the shared checkout path
        run: python .github/scripts/promote_job_specs.py


        
  deploy-jobs:
    needs: update-notebook-paths
    runs-on: ubuntu-latest
    environment: free
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/scripts/requirements.txt') }}
      - run: pip install -r .github/scripts/requirements.txt
      - name: Deploy job definitions
        run: python .github/scripts/deploy_databricks_jobs.py


  
  make-pull-on-git-folder:
    needs: deploy-jobs
    runs-on: ubuntu-latest
    environment: free
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/scripts/requirements.txt') }}
      - run: pip install -r .github/scripts/requirements.txt
      - name: Sync the shared Repos checkout to main
        run: python .github/scripts/sync_shared_repo.py
