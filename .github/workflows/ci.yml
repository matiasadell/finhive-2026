name: CI

on:
  pull_request:
    branches: [main]
  # The agent is built as commits on `matias`, with a single pull request to `main` once the
  # deploy pipeline works end to end (docs/plan/agent-build-plan.md). Without this trigger no
  # check would run between now and then.
  push:
    branches: [matias]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check:
          - validate_job_specs.py
          - validate_notebooks.py
          - check_agent_layering.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r .github/scripts/requirements.txt

      - run: python .github/scripts/${{ matrix.check }}
